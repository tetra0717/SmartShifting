<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SmartShifting / Glint</title>
  <link rel="stylesheet" href="/glint.css">
</head>
<body class="display">
  <canvas id="scene" aria-label="Glintの識別対象"></canvas>
  <aside id="controls" aria-label="Glintの操作">
    <p class="eyebrow">SMARTSHIFTING / GLINT</p>
    <h1>スマホで、対象に触れる。</h1>
    <p>同じWi-Fiのスマホで下のURLを開き、カメラを起動してください。</p>
    <div id="urls"></div>
    <p class="fine"><a href="/setup" target="_blank" rel="noopener">初回のスマホ接続ガイド</a></p>
    <p class="fine">背面レンズを対象に近づけ、静止させます。測定するときはこの操作パネルを隠してください。</p>
    <div class="row">
      <button id="fullscreen">全画面</button>
      <button id="hide" class="primary">操作を隠す（H）</button>
    </div>
    <p id="connection" class="connection" role="status">接続中…</p>
    <h2>接続中のスマホ</h2>
    <div id="devices"><p class="fine">スマホの接続を待っています。</p></div>
    <p id="error" role="alert"></p>
    <details>
      <summary>開発・診断</summary>
      <label>対象数
        <select id="count"><option>3</option><option selected>6</option><option>9</option><option>12</option><option>20</option></select>
      </label>
      <label>揺らぎの強さ <output id="strengthValue">0.80</output>
        <input id="strength" type="range" min="0" max="1.5" step="0.05" value="0.8">
      </label>
      <button id="apply">設定を適用</button>
      <p id="stats" class="fine"></p>
      <label class="check"><input id="record" type="checkbox">詳細なRGB・表示履歴を記録</label>
      <button id="export">診断ログを保存</button>
      <p class="fine">通常ログは自動記録します。詳細記録はメモリを使用します。</p>
    </details>
  </aside>
  <button id="show" hidden>操作を表示（H）</button>
  <script type="module" src="/glint-display.js"></script>
</body>
</html>
